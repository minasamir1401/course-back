version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lms_postgres_local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata_local:
